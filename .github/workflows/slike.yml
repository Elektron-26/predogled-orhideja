name: Prenos slik
on:
  push:
    paths: ['slike.txt', '.github/workflows/slike.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prenos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prenesi slike
        run: |
          mkdir -p img
          while read -r ime url; do
            [ -z "$ime" ] && continue
            curl -fsSL -A "Mozilla/5.0" "$url" -o "img/$ime" && echo "OK $ime" || echo "NAPAKA $ime"
          done < slike.txt
          ls -la img
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add img
          git diff --cached --quiet || git commit -m "Slike s Facebooka"
          git push
